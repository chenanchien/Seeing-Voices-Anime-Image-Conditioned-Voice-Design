[project]
name = "anime-voice-dataset"
version = "0.1.0"
description = "Character art + Japanese voice + CV dataset for image-conditioned voice design (CMU 10-423)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "soxr>=0.3.7",
    "pyloudnorm>=0.1.1",
    "faster-whisper>=1.1.0",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
