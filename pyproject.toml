[project]
name = "anime-voice-dataset"
version = "0.1.0"
description = "Character art + Japanese voice + CV dataset for image-conditioned voice design (CMU 10-423)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "soxr>=0.3.7",
    "pyloudnorm>=0.1.1",
    "faster-whisper>=1.1.0",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyarrow>=26.0.0",
    "huggingface-hub>=2.3.0",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
embed = [
    "torch>=2.4",
    "transformers>=4.45",
    "sentencepiece>=0.2",  # SigLIP tokenizer
]

[dependency-groups]
train = [
    "torch>=2.4",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "pytest>=8.0",
    "pandas>=3.1.1",
]

[tool.uv]
package = false
